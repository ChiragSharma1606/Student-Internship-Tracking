<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reports – InternTrack</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body class="bg-light">

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-dark it-navbar sticky-top">
    <div class="container-fluid px-4">
      <a class="navbar-brand fw-bold" href="index.html">
        <i class="bi bi-mortarboard-fill me-2"></i>InternTrack
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto align-items-center gap-2">
          <li class="nav-item">
            <span class="nav-link text-white-50 small" id="navUser"></span>
          </li>
          <li class="nav-item">
            <a id="dashLink" href="#" class="btn btn-outline-light btn-sm">
              <i class="bi bi-house me-1"></i>Dashboard
            </a>
          </li>
          <li class="nav-item">
            <button onclick="logout()" class="btn btn-danger btn-sm">
              <i class="bi bi-box-arrow-right me-1"></i>Logout
            </button>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container-fluid px-4 py-4">

    <!-- BREADCRUMB -->
    <nav aria-label="breadcrumb" class="mb-3">
      <ol class="breadcrumb small">
        <li class="breadcrumb-item"><a href="index.html" class="text-decoration-none">Home</a></li>
        <li class="breadcrumb-item"><a id="dashBreadcrumb" href="#" class="text-decoration-none">Dashboard</a></li>
        <li class="breadcrumb-item active" id="pageTitle">Reports</li>
      </ol>
    </nav>

    <!-- PAGE HEADER -->
    <div class="d-flex align-items-center justify-content-between mb-4">
      <div>
        <h4 class="fw-bold mb-0" id="pageHeading">Reports</h4>
        <p class="text-muted small mb-0" id="pageSubtitle">Loading...</p>
      </div>
      <div id="reportCount" class="d-none">
        <span class="badge bg-primary rounded-pill fs-6 px-3" id="countNum">0</span>
        <span class="text-muted small ms-1">reports</span>
      </div>
    </div>

    <!-- ALERTS -->
    <div id="errorMsg" class="alert alert-danger d-none" role="alert"></div>

    <!-- LOADING -->
    <div id="loadingMsg" class="text-center py-5">
      <div class="spinner-border text-primary mb-3" role="status"></div>
      <p class="text-muted">Loading reports...</p>
    </div>

    <!-- FILTER BAR -->
    <div id="filterBar" class="d-none mb-3">
      <div class="d-flex gap-2 flex-wrap align-items-center">
        <span class="text-muted small me-1">Filter:</span>
        <button class="btn btn-sm btn-primary it-filter-btn" data-filter="all" onclick="filterReports(this, 'all')">
          All <span class="badge bg-white text-primary ms-1" id="cntAll">0</span>
        </button>
        <button class="btn btn-sm btn-outline-secondary it-filter-btn" data-filter="pending" onclick="filterReports(this, 'pending')">
          <i class="bi bi-hourglass-split me-1"></i>Pending
          <span class="badge bg-warning text-dark ms-1" id="cntPending">0</span>
        </button>
        <button class="btn btn-sm btn-outline-secondary it-filter-btn" data-filter="approved" onclick="filterReports(this, 'approved')">
          <i class="bi bi-check-circle me-1"></i>Approved
          <span class="badge bg-success ms-1" id="cntApproved">0</span>
        </button>
        <button class="btn btn-sm btn-outline-secondary it-filter-btn" data-filter="rejected" onclick="filterReports(this, 'rejected')">
          <i class="bi bi-x-circle me-1"></i>Rejected
          <span class="badge bg-danger ms-1" id="cntRejected">0</span>
        </button>
      </div>
    </div>

    <!-- REPORTS LIST -->
    <div id="reportsList" class="d-flex flex-column gap-3"></div>

    <!-- EMPTY STATE -->
    <div id="emptyState" class="d-none text-center py-6">
      <i class="bi bi-inbox text-muted" style="font-size:4rem;"></i>
      <h5 class="fw-semibold mt-3 mb-1">No Reports Found</h5>
      <p class="text-muted small" id="emptyMsg">No reports match the selected filter.</p>
      <a href="submit_report.html" class="btn btn-primary btn-sm mt-2" id="submitLink">
        <i class="bi bi-plus-circle me-1"></i>Submit Your First Report
      </a>
    </div>

  </div>

  <!-- BOOTSTRAP TOAST CONTAINER -->
  <div class="position-fixed bottom-0 end-0 p-3" style="z-index:1100" id="toastContainer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script>
    const user = JSON.parse(sessionStorage.getItem('user') || '{}');
    if (!user.user_id) window.location.href = 'index.html';

    const role = user.role;
    document.getElementById('navUser').innerHTML = `<i class="bi bi-person-circle me-1"></i>${user.username || ''}`;

    // Role-specific setup
    if (role === 'faculty') {
      document.getElementById('dashLink').href        = 'teacher_dashboard.html';
      document.getElementById('dashBreadcrumb').href  = 'teacher_dashboard.html';
      document.getElementById('pageHeading').textContent  = 'Student Progress Reports';
      document.getElementById('pageSubtitle').textContent = 'Review and approve student weekly progress reports';
      document.getElementById('pageTitle').textContent    = 'Student Reports';
      document.getElementById('submitLink').classList.add('d-none');
      document.getElementById('filterBar').classList.remove('d-none');
    } else {
      document.getElementById('dashLink').href        = 'student_dashboard.html';
      document.getElementById('dashBreadcrumb').href  = 'student_dashboard.html';
      document.getElementById('pageHeading').textContent  = 'My Progress Reports';
      document.getElementById('pageSubtitle').textContent = 'View the status of your submitted weekly reports';
      document.getElementById('pageTitle').textContent    = 'My Reports';
      document.getElementById('filterBar').classList.remove('d-none');
    }

    let allReports = [];
    let activeFilter = 'all';

    async function loadReports() {
      try {
        let res;
        if (role === 'faculty') {
          res = await apiGet('/api/teacher/reports');
          if (res.status === 'success') allReports = res.data.reports;
        } else {
          res = await apiGet('/api/student/progress');
          if (res.status === 'success') allReports = res.data.progress;
        }

        if (res.status !== 'success') {
          const err = document.getElementById('errorMsg');
          err.textContent = res.message;
          err.classList.remove('d-none');
          document.getElementById('loadingMsg').classList.add('d-none');
          return;
        }

        // Update filter counts
        updateCounts();
        document.getElementById('loadingMsg').classList.add('d-none');
        document.getElementById('reportCount').classList.remove('d-none');
        renderReports(allReports);

      } catch (err) {
        document.getElementById('loadingMsg').classList.add('d-none');
        const errEl = document.getElementById('errorMsg');
        errEl.innerHTML = '<i class="bi bi-wifi-off me-2"></i>Failed to load reports. Is the backend running?';
        errEl.classList.remove('d-none');
      }
    }

    function updateCounts() {
      document.getElementById('cntAll').textContent      = allReports.length;
      document.getElementById('cntPending').textContent  = allReports.filter(r=>r.status==='pending').length;
      document.getElementById('cntApproved').textContent = allReports.filter(r=>r.status==='approved').length;
      document.getElementById('cntRejected').textContent = allReports.filter(r=>r.status==='rejected').length;
    }

    function filterReports(btn, filter) {
      activeFilter = filter;
      document.querySelectorAll('.it-filter-btn').forEach(b => {
        b.classList.remove('btn-primary','btn-warning','btn-success','btn-danger');
        b.classList.add('btn-outline-secondary');
      });
      btn.classList.remove('btn-outline-secondary');
      if (filter === 'pending')  btn.classList.add('btn-warning');
      else if (filter === 'approved') btn.classList.add('btn-success');
      else if (filter === 'rejected') btn.classList.add('btn-danger');
      else btn.classList.add('btn-primary');

      const filtered = filter === 'all' ? allReports : allReports.filter(r => r.status === filter);
      document.getElementById('countNum').textContent = filtered.length;
      renderReports(filtered);
    }

    function renderReports(reports) {
      const list  = document.getElementById('reportsList');
      const empty = document.getElementById('emptyState');
      document.getElementById('countNum').textContent = reports.length;
      list.innerHTML = '';

      if (!reports.length) {
        empty.classList.remove('d-none');
        document.getElementById('emptyMsg').textContent =
          activeFilter === 'all' ? 'No reports have been submitted yet.' : `No ${activeFilter} reports found.`;
        return;
      }
      empty.classList.add('d-none');

      reports.forEach(r => {
        const statusCls   = r.status === 'approved' ? 'bg-success'
          : r.status === 'rejected' ? 'bg-danger' : 'bg-warning text-dark';
        const borderCls   = r.status === 'approved' ? 'it-report-approved'
          : r.status === 'rejected' ? 'it-report-rejected' : 'it-report-pending';
        const isPending   = r.status === 'pending';
        const isTeacher   = role === 'faculty';

        const studentMeta = isTeacher ? `
          <div class="d-flex gap-3 flex-wrap mt-2">
            <span class="text-muted small"><i class="bi bi-person me-1"></i>${r.student_name}</span>
            <span class="text-muted small"><i class="bi bi-tag me-1"></i>${r.roll_no}</span>
            <span class="text-muted small"><i class="bi bi-building me-1"></i>${r.company_name}</span>
            <span class="text-muted small"><i class="bi bi-code-slash me-1"></i>${r.domain}</span>
          </div>` : '';

        const actionBtns = isTeacher && isPending ? `
          <div class="d-flex gap-2">
            <button class="btn btn-sm btn-success px-3"
              onclick="updateStatus(${r.progress_id}, 'approved', this)">
              <i class="bi bi-check-lg me-1"></i>Approve
            </button>
            <button class="btn btn-sm btn-outline-danger px-3"
              onclick="updateStatus(${r.progress_id}, 'rejected', this)">
              <i class="bi bi-x-lg me-1"></i>Reject
            </button>
          </div>` : '';

        list.innerHTML += `
          <div class="card border-0 shadow-sm ${borderCls}" id="report-${r.progress_id}">
            <div class="card-body p-4">
              <div class="d-flex align-items-start justify-content-between gap-3">
                <div class="flex-grow-1">
                  <div class="d-flex align-items-center gap-2 flex-wrap mb-1">
                    <span class="badge bg-primary rounded-pill">Week ${r.week_no}</span>
                    <span class="badge ${statusCls} rounded-pill">${r.status.charAt(0).toUpperCase()+r.status.slice(1)}</span>
                    <span class="text-muted small ms-1">
                      <i class="bi bi-calendar3 me-1"></i>${formatDate(r.submitted_at)}
                    </span>
                  </div>
                  ${studentMeta}
                </div>
                ${actionBtns}
              </div>
              <p class="mt-3 mb-0 text-dark small lh-lg">${r.report}</p>
            </div>
          </div>`;
      });
    }

    async function updateStatus(progressId, status, btn) {
      const card = document.getElementById(`report-${progressId}`);
      const btns = btn.parentElement.querySelectorAll('button');
      btns.forEach(b => b.disabled = true);
      btn.innerHTML = `<span class="spinner-border spinner-border-sm me-1"></span>${status==='approved'?'Approving…':'Rejecting…'}`;

      try {
        const res = await apiPost('/api/teacher/approve-report', { progress_id: progressId, status });
        if (res.status === 'success') {
          // Update in-place
          const report = allReports.find(r => r.progress_id === progressId);
          if (report) report.status = status;
          updateCounts();
          showToast(res.message, status === 'approved' ? 'success' : 'danger');
          // Re-render current filter
          const filtered = activeFilter === 'all' ? allReports : allReports.filter(r => r.status === activeFilter);
          renderReports(filtered);
        } else {
          showToast(res.message || 'Failed to update.', 'danger');
          btns.forEach(b => b.disabled = false);
        }
      } catch (err) {
        showToast('Server error. Please try again.', 'danger');
        btns.forEach(b => b.disabled = false);
      }
    }

    loadReports();
  </script>
</body>
</html>
